<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>

    <h1>Form</h1>

        <label for="pincode">Pincode</label>
        <input type="text" id="pincode" name="pincode">
    </div>
    <button type="submit">Submit</button>
</body>
</html>
