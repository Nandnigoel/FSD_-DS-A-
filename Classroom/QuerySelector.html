<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Query Selector</title>
</head>
<body>
    <h2>DOM close() Method</h2>
    <button onclick="practice()">Submit</button>
    <h1 id="myH1" class="democlass">The Elemnt Object</h1>
    <p id="demo"></p>
    <ul>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
        <li>Item 4</li>
    </ul>
    <script>
        // const test=document.querySelector("ul li:nth-child(3)");
        const test=document.querySelectorAll("ul li");
        for(let x of test){
            x.style.backgroundColor="blue";
            x.style.padding="10px";
            x.style.color="white";
        }
        const element=document.getElementById("myH1");
        let text=element.getAttribute("class");
        document.getElementById("demo").innerHTML=text;
    </script>
</body>
</html>
