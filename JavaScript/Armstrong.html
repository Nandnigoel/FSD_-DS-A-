<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let org=prompt("Enter your number");
        let num=org;
        let sum=0;
        let d=org.length;
        while(num>0){
            let n=num%10;
            sum=sum+(n**d);
            num=Math.floor(num/10);
        }
        if(sum==org){
            console.log("YES")
        }else{
            console.log("NO");
        }
    </script>
</body>
</html>
