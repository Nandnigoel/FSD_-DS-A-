<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operators</title>
</head>
<body>
    <script>
        let a=12;
        let b=30;
        let c=a+b;
        document.write(c);
        let sub=a-b;
        document.write(" "+sub);
        let mul=a*b;
        document.write(" "+mul );
        let div=a/b;
        document.write(" "+div );
    </script>
</body>
</html>
